name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Linux ${{ matrix.kernel }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 24.04 GA kernel (6.8) and HWE kernel (newest available)
        kernel: [generic, generic-hwe-24.04]

    steps:
      - uses: actions/checkout@v4

      - name: Install kernel, headers and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            linux-image-${{ matrix.kernel }} linux-headers-${{ matrix.kernel }} \
            qemu-system-x86 busybox-static cpio sparse
          KVER=$(ls /lib/modules | grep -- '-generic$' | sort -V | tail -1)
          sudo chmod 0644 /boot/vmlinuz-$KVER
          echo "KVER=$KVER" >> "$GITHUB_ENV"
          echo "Testing against $KVER"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build module (warnings are errors)
        run: make module KCFLAGS=-Werror

      - name: Static analysis (checkpatch, sparse)
        if: matrix.kernel == 'generic'
        run: make check

      - name: Build tests and tools
        run: make userspace

      - name: Boot kernel in QEMU and run tests
        run: make qemu-test
